<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link id="md-light" rel="stylesheet" href="github-markdown-light.css">
  <link id="md-dark" rel="stylesheet" href="github-markdown-dark.css" disabled>
  <link rel="stylesheet" href="katex.min.css">
  <link id="hljs-light" rel="stylesheet" href="github.min.css">
  <link id="hljs-dark" rel="stylesheet" href="github-dark.min.css" disabled>
  <style>
    html, body { margin: 0; }
    body { padding: 28px 32px 48px; }
    .markdown-body {
      box-sizing: border-box;
      max-width: 980px;
      margin: 0 auto;
      background: transparent;
    }
    .markdown-body img { max-width: 100%; }
    .markdown-body pre { overflow: auto; }
    .markdown-body .mermaid { margin: 1em 0; text-align: center; background: transparent; }
    .markdown-body .mermaid svg { max-width: 100%; height: auto; }
    .markdown-body .task-list-item { list-style: none; }
    .markdown-body .task-list-item input { margin-right: 0.35em; }
    .markdown-body [align="center"] { text-align: center; }
    .markdown-body [align="right"] { text-align: right; }
    #status { font: 13px -apple-system, sans-serif; }
  </style>
</head>
<body>
  <article id="content" class="markdown-body"><p id="status">Rendering…</p></article>
  <script src="markdown-it.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="cmake.min.js"></script>
  <script src="dockerfile.min.js"></script>
  <script src="dart.min.js"></script>
  <script src="haskell.min.js"></script>
  <script src="protobuf.min.js"></script>
  <script src="makefile.min.js"></script>
  <script src="nginx.min.js"></script>
  <script src="elixir.min.js"></script>
  <script src="katex.min.js"></script>
  <script src="mermaid.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
